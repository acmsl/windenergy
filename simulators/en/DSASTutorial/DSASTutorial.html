<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="generator" content="DSASTutorial-es">
	<title>Tutorial - Active Stall Two-Speed Wind Turbine</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<script type="text/javascript">
		function escapeHtml(unsafe) {
			return String(unsafe || '')
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#039;")
				.replace(/:/g, "");
		}

		function getTopicFromUrl() {
			var href = '';
			try { href = top.location.href; }
			catch (e) { return ''; }
			var q = href.lastIndexOf('?');
			if (q <= 0) return '';
			var topic = href.substring(q + 1);
			var h = topic.indexOf('#');
			if (h >= 0) topic = topic.substring(0, h);
			return topic;
		}

		function setInitialTopicFromQuery() {
			var topic = getTopicFromUrl();
			if (!topic) return;
			topic = escapeHtml(topic);
			if (!topic) return;
			try { frames['FrameMain'].location.replace(topic); }
			catch (e) { /* ignore */ }
		}

		if (window.addEventListener) window.addEventListener('load', setInitialTopicFromQuery, false);
		else if (window.attachEvent) window.attachEvent('onload', setInitialTopicFromQuery);
	</script>
</head>
	<frameset cols="300,*">
		<frame src="toc.html" name="FrameTOC">
		<frame src="Introduccion.html" name="FrameMain">
	</frameset>
