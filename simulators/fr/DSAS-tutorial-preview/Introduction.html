	<div id="topic_content">
		
<p class="rvps4"><span class="rvts11">Ce tutoriel est pour le "</span><span class="rvts14">Simulateur de éolienne à deux vitesses avec Active Stall</span><span class="rvts11">" qui fait partie de la famille de simulateurs de </span><a class="rvts15" href="https://www.acm-sl.com" target="_blank">ACM SL</a><span class="rvts11"> &nbsp;spécifiques pour éoliennes. En ce case, l'éolienne simulée utilise un générateur de cage d'écureuil que peut fonctionner à deux vitesses fixes. Le contrôle de la chaîne de puissance mécanique est fait par la méthode de "décrochage actif" (Active Stall). Este simulador conrresponde avec la configuration "</span><span class="rvts13">DSASWTSimulator.conf</span><span class="rvts11">"pour l'application LdPv10.</span></p>
<p class="rvps4"><span class="rvts11">Les objectifs de ce simulateur sont:</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts14">Simuler le comportement de chaque sous-système</span><span class="rvts11"> à l'intérieur d'une éolienne.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Présenter un </span><span class="rvts14">ensemble d'outils de visualisation</span><span class="rvts11"> afin que l'utilisateur peut effectivement regarder les valeurs de chaque signal à l'intérieur de l'éolienne, et voir son évolution.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts14">Interagir avec les éoliennes</span><span class="rvts11"> en modifiant les conditions d'environnement (vitesse du vent, direction du vent, réseau électrique, températures, etc.) afin d'observer la réaction de l'éolienne.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Présenter les </span><span class="rvts14">aspects de sécurité</span><span class="rvts11"> de l'exploitation des éoliennes.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Définir des </span><span class="rvts14">situations exceptionelles</span><span class="rvts11"> pour les conditions extérieures (vents extrêmes, par exemple) et observer la reaction de l'éolienne.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Définir les </span><span class="rvts14">défauts dans les systèmes internes</span><span class="rvts11"> et observer la réaction de l'éolienne.</span></p>
<p class="rvps4"><span class="rvts11">En conséquence, l'utilisateur de ce simulateur peut:</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Comprendre les </span><span class="rvts14">principes physiques</span><span class="rvts11"> sur lesquels ce type d'éolienne est basée.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Savoir comment est la </span><span class="rvts14">structure interne</span><span class="rvts11"> de ce type &nbsp;d'éolienne.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Connaître en détail les </span><span class="rvts14">algorithmes</span><span class="rvts11"> utilisés dans chaque sous-système et les paramètres qui y sont utilisés.</span></p>
<p class="rvps4" style="text-indent: -24px; padding-left: 24px; margin-left: 0px;"><span style="font-size: 12pt; font-family: Symbola, 'Arial Unicode MS', 'Lucida Sans Unicode', 'Arial', 'Helvetica', sans-serif; color: #000000; display: inline-block; text-indent: 0px; min-width: 24px;">•</span><span class="rvts11">Comprendre les </span><span class="rvts14">principes de conception du contrôleur</span><span class="rvts11"> de ce type &nbsp;d'éolienne.</span></p>
<p class="rvps4"><span class="rvts11">Pour atteindre cet objectif, nous présentons dans ce</span><span class="rvts14"> tutoriel les principes physiques</span><span class="rvts11"> régissant les différents sous-systèmes impliqués dans la conception de ce type &nbsp;d'éolienne.</span></p>
<p class="rvps4"><span class="rvts11"><br/></span></p>
